name: Create FSH from ATT&CK Data

on:
  push:
    branches:
      - 'feature/**'  
    workflow_call:

jobs:
  create_fsh:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mitreattack-python

      - name: Build tactics and techniques data structure
        run: python scripts/create_tactics_and_techniques.py
      
      - name: Upload tactics and techniques json as artifact 
        uses: actions/upload-artifact@v4
        with: 
          name: tactics-and-techniques-data
          path: scripts/MITRE_DATA/*.json

      - name: Generate FSH files
        run: python scripts/create_fsh.py

      - name: Upload FSH files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsh-files
          path: scripts/MITRE_FSH/**/*.fsh
          if-no-files-found: error  
          retention-days: 5       